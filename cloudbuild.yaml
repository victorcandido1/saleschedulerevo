steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/salescheduler', '.']

  # Push da imagem para Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/salescheduler']

  # Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'salescheduler'
      - '--image'
      - 'gcr.io/$PROJECT_ID/salescheduler'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--set-env-vars'
      - 'SF_USERNAME=${_SF_USERNAME},SF_PASSWORD=${_SF_PASSWORD},SF_SECURITY_TOKEN=${_SF_SECURITY_TOKEN},SF_DOMAIN=${_SF_DOMAIN}'

images:
  - 'gcr.io/$PROJECT_ID/salescheduler'

substitutions:
  _SF_USERNAME: ''
  _SF_PASSWORD: ''
  _SF_SECURITY_TOKEN: ''
  _SF_DOMAIN: 'login'
